<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {{
          font-family: Arial, sans-serif;
          line-height: 1.6;
          color: #333;
      }}
      .container {{
          max-width: 600px;
          margin: 0 auto;
          padding: 20px;
          background-color: #f9f9f9;
      }}
      .header {{
          background-color: #2c3e50;
          color: white;
          padding: 20px;
          border-radius: 5px 5px 0 0;
          text-align: center;
      }}
      .content {{
          background-color: white;
          padding: 30px;
          border-radius: 0 0 5px 5px;
      }}
      .button-group {{
          margin-top: 30px;
          display: flex;
          justify-content: center;
      }}
      .button {{
          padding: 12px 30px;
          text-decoration: none;
          border-radius: 5px;
          font-weight: bold;
          font-size: 16px;
          display: inline-block;
          text-align: center;
      }}
      .btn-yes {{
          background-color: #27ae60;
          color: white;
      }}
      .footer {{
          margin-top: 20px;
          font-size: 12px;
          color: #666;
          text-align: center;
          border-top: 1px solid #eee;
          padding-top: 15px;
      }}
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Resume Profile Update Request</h2>
      </div>
      <div class="content">
        <p>Hello {name},</p>
        <p>
          Want to update your resume? Click the button below to open the
          employee dashboard and make your changes.
        </p>
        <div class="button-group">
          <a href="{update_url}" class="button btn-yes"
            >Open Employee Dashboard</a
          >
        </div>
        <div class="footer">
          <p>Thanks,<br />Resume Sync Team</p>
          <p style="margin-top: 10px; font-size: 11px">
            If the button does not work, copy and paste this link into your
            browser:
            <br /><a href="{update_url}">{update_url}</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
