server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path that isn't a real
    # file (e.g. /hr-dashboard on a hard refresh) must fall back to
    # index.html so the SPA can handle it, or nginx would 404 it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
